name: Process Video

on:
  repository_dispatch:
    types: [process_video]
  workflow_dispatch:

jobs:
  process:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Install system dependencies (ffmpeg)
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg

    - name: Install Python dependencies
      run: |
        pip install yt-dlp funasr modelscope cloudinary pypinyin huggingface-hub

    - name: Run process_video.py
      env:
        CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
        CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
        CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
      run: |
        python process_video.py "${{ github.event.client_payload.video_url }}"

    - name: Commit data.json back to repo
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add public/data.json
        # Only commit if there are changes
        git commit -m "Auto-update data.json from Github Actions" || echo "No changes to commit"
        git push

    - name: Notify Telegram on Success
      if: success()
      run: |
        curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
        -d chat_id="${{ github.event.client_payload.chat_id }}" \
        -d text="✅ Bước 1 đã hoàn tất! Video đã được bóc băng và đẩy lên Github. Bạn có thể bấm nút BƯỚC 2 ngay bây giờ!"

    - name: Notify Telegram on Failure
      if: failure()
      run: |
        curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
        -d chat_id="${{ github.event.client_payload.chat_id }}" \
        -d text="❌ Lỗi: Quá trình bóc băng trên Github thất bại (Có thể do Facebook chặn hoặc thiếu Secret). Bạn hãy kiểm tra lại kho Github nhé!"
