name: Process Video and Deploy to Pages

on:
  repository_dispatch:
    types: [process_video]
  workflow_dispatch:
    inputs:
      video_url:
        description: 'URL of the video to process'
        required: true

jobs:
  process-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python Dependencies
        run: |
          pip install -r requirements.txt

      - name: Extract Video URL and Chat ID
        id: get_url
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "URL=${{ github.event.client_payload.video_url }}" >> $GITHUB_ENV
            echo "CHAT_ID=${{ github.event.client_payload.chat_id }}" >> $GITHUB_ENV
          else
            echo "URL=${{ github.event.inputs.video_url }}" >> $GITHUB_ENV
            echo "CHAT_ID=" >> $GITHUB_ENV
          fi

      - name: Cache ModelScope Models
        id: cache-models
        uses: actions/cache@v3
        with:
          path: ~/.cache/modelscope
          key: ${{ runner.os }}-modelscope-funasr

      - name: Notify Setup and Cache Status
        if: env.CHAT_ID != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          if [ "${{ steps.cache-models.outputs.cache-hit }}" == "true" ]; then
            curl -s -X POST https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage -d chat_id=${{ env.CHAT_ID }} -d text="⚡ Đã tìm thấy bộ nhớ đệm (Cache)! Hệ thống đã sẵn sàng. Ước tính: ~1-2 phút."
          else
            curl -s -X POST https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage -d chat_id=${{ env.CHAT_ID }} -d text="🐢 Không tìm thấy bộ nhớ đệm. Đang tải lại mô hình AI (vài trăm MB). Ước tính: ~4-5 phút."
          fi

      - name: Process Video with FunASR
        env:
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          VIDEO_URL: ${{ env.URL }}
        run: |
          if [ -n "${{ env.CHAT_ID }}" ]; then
             curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage -d chat_id=${{ env.CHAT_ID }} -d text="🧠 Đang bóc băng phụ đề bằng AI FunASR..."
          fi
          python process_video.py

      - name: Build Commercial HTML and Send to Telegram
        if: env.CHAT_ID != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          curl -s -X POST https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage -d chat_id=${{ env.CHAT_ID }} -d text="🎁 Đang đóng gói bản thương mại (HTML Offline)..."
          python build.py
          HTML_FILE=$(ls *.html | head -n 1)
          if [ -n "$HTML_FILE" ]; then
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
              -F chat_id=${{ env.CHAT_ID }} \
              -F document=@"$HTML_FILE" \
              -F caption="🎉 Đây là file HTML thương mại độc lập của bạn! Tải về là dùng được ngay không cần mạng."
          fi

      - name: Notify Deploying
        if: env.CHAT_ID != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          curl -s -X POST https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage -d chat_id=${{ env.CHAT_ID }} -d text="🚀 Xử lý xong AI! Đang đẩy video và giao diện lên mạng..."

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Send success message to Telegram
        if: success() && env.CHAT_ID != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          curl -s -X POST https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage -d chat_id=${{ env.CHAT_ID }} -d text="✅ Hoàn tất! Bạn có thể xem ngay tại: https://infinitehorizons2012-code.github.io/da-shado-tt/"

      - name: Send failure message to Telegram
        if: failure() && env.CHAT_ID != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          curl -s -X POST https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage -d chat_id=${{ env.CHAT_ID }} -d text="❌ Ối! Có lỗi xảy ra trong quá trình chạy (có thể do lỗi mạng tải thư viện hoặc AI FunASR). Sẽ không có trang web nào được tạo ra. Vui lòng vào tài khoản GitHub của bạn để kiểm tra Actions log."
