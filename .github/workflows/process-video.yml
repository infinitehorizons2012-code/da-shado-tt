name: Process Video and Deploy to Pages

on:
  repository_dispatch:
    types: [process_video]
  workflow_dispatch:
    inputs:
      video_url:
        description: 'URL of the video to process'
        required: true

jobs:
  process-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python Dependencies
        run: |
          pip install -r requirements.txt

      - name: Extract Video URL
        id: get_url
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "URL=${{ github.event.client_payload.video_url }}" >> $GITHUB_ENV
          else
            echo "URL=${{ github.event.inputs.video_url }}" >> $GITHUB_ENV
          fi

      - name: Process Video with FunASR
        env:
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          VIDEO_URL: ${{ env.URL }}
        run: |
          python process_video.py

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Send success message to Telegram
        if: success() && github.event_name == 'repository_dispatch'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ github.event.client_payload.chat_id }}
        run: |
          curl -s -X POST https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage -d chat_id=${CHAT_ID} -d text="✅ Hoàn tất! Video đã xử lý xong. Xem tại: https://infinitehorizons2012-code.github.io/da-shado-tt/"

      - name: Send failure message to Telegram
        if: failure() && github.event_name == 'repository_dispatch'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ github.event.client_payload.chat_id }}
        run: |
          curl -s -X POST https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage -d chat_id=${CHAT_ID} -d text="❌ Có lỗi xảy ra trong quá trình chạy GitHub Actions (có thể do lỗi cấu hình hoặc AI FunASR). Vui lòng vào GitHub để kiểm tra log chi tiết."
